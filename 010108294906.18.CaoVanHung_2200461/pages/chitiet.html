<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết kiểm tra trùng lặp văn bản</title>
    <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/chitiet.css">
    <!-- Hộp thoại thông báo dùng chung: nạp trước mọi script khác để thay window.alert -->
    <script src="../js/hop-thoai.js"></script>
</head>
<body>

    <!-- Header điều hướng -->
    <div class="viewer-header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="file-title-display" id="headerFileName">Đang tải tên tài liệu...</span>
        </div>
        <div class="header-right">
            <span style="font-size: 14px; color: #64748b;" id="totalSourcesCount">0 nguồn trùng lặp</span>

            <!-- Nút Xuất Excel (YÊU CẦU 1) -->
            <button id="btnXuatExcelChiTiet"
                onclick="xuatExcelChiTiet()"
                style="
                    display:flex;align-items:center;gap:6px;
                    padding:7px 14px;border-radius:7px;border:none;
                    background:#16a34a;color:#fff;font-size:13px;
                    font-weight:600;cursor:pointer;transition:opacity .15s;
                "
                title="Xuất kết quả ra file Excel"
            >
                <i class="fa-solid fa-file-excel"></i> Xuất Excel
            </button>

            <!-- Nút Đánh giá (YÊU CẦU 3) -->
            <button id="btnDanhGia"
                onclick="moModalDanhGia('', window.__reportId__ || '')"
                style="
                    display:flex;align-items:center;gap:6px;
                    padding:7px 14px;border-radius:7px;border:none;
                    background:#f59e0b;color:#fff;font-size:13px;
                    font-weight:600;cursor:pointer;transition:opacity .15s;
                "
                title="Đánh giá phần mềm"
            >
                <i class="fa-solid fa-star"></i> Đánh giá
            </button>
        </div>
    </div>

    <!-- Nội dung chia 2 cột -->
    <div class="viewer-body">
        
       <!-- Cột bên trái: Hiển thị file thực tế -->
        <div class="doc-preview-pane">
            <div class="pdf-khung">

                <!-- Thanh công cụ tự dựng, thay cho toolbar của trình duyệt -->
                <div id="pdfToolbar" class="pdf-toolbar">

                    <button type="button" id="pdfToggleThumbs"
                        class="pdf-nut pdf-nut--bat" title="Ẩn/hiện danh sách trang">&#9776;</button>

                    <span id="pdfTitle" class="pdf-toolbar__ten"></span>

                    <div class="pdf-toolbar__nhom">
                        <button type="button" id="pdfPrevPage"
                            class="pdf-nut" title="Trang trước">&#8249;</button>

                        <input type="number" id="pdfPageInput" min="1" value="1"
                            class="pdf-o-trang" title="Nhảy tới trang">

                        <span id="pdfPageTotal" style="color:#9aa0a6;">/ --</span>

                        <button type="button" id="pdfNextPage"
                            class="pdf-nut" title="Trang sau">&#8250;</button>
                    </div>

                    <div class="pdf-toolbar__vach"></div>

                    <div class="pdf-toolbar__nhom">
                        <button type="button" id="pdfZoomOut"
                            class="pdf-nut" title="Thu nhỏ">&minus;</button>

                        <span id="pdfZoomLevel" class="pdf-muc-zoom">100%</span>

                        <button type="button" id="pdfZoomIn"
                            class="pdf-nut" title="Phóng to">+</button>
                    </div>

                    <div class="pdf-toolbar__vach"></div>

                    <div class="pdf-toolbar__nhom">
                        <button type="button" id="pdfPrint"
                            class="pdf-nut" title="In tài liệu">&#128424;</button>

                        <a id="pdfDownload" download class="pdf-nut"
                            title="Tải xuống bản bôi màu">&#11123;</a>
                    </div>
                </div>

                <!-- Thông báo số chỗ trùng của nguồn đang chọn -->
                <div id="pdfMatchInfo" class="pdf-thongbao"></div>

                <div class="pdf-than">
                    <!-- Dải ảnh thu nhỏ các trang -->
                    <div id="pdfThumbnails" class="pdf-thumbs"></div>

                    <!-- Vùng render các trang PDF, highlight được phủ lên đây -->
                    <div id="pdfViewer" class="pdf-vung-trang"></div>
                </div>
            </div>

            <!-- Chân trang báo cáo -->
            <div class="doc-footer-info">
                <span id="pageCountDisplay">Kiểm tra trùng lặp</span>
                <span id="lastModifiedDisplay">Chỉnh sửa lần cuối: Đang cập nhật...</span>
            </div>
        </div>

        <!-- Cột bên phải: Danh sách nguồn trùng lặp -->
        <div class="similarity-sidebar">
            <div class="sidebar-top-card">
                <span style="font-weight: 600; color: #0f172a; font-size: 14px;">Tất cả trùng lặp</span>
                <span class="total-similarity-badge" id="sidebarMatchCount">2 tài liệu</span>
            </div>

            <div class="similarity-score-box">
                <span style="font-weight: 600; color: #475569; font-size: 14px;">Tỉ lệ trùng lặp</span>
                <span style="font-size: 20px; font-weight: 700; color: #ef4444;" id="overallSimilarityScore">7%</span>
            </div>

            <div class="similarity-list-container" id="similarityListContainer">
                <!-- Danh sách nguồn mẫu -->
                <div class="source-card">
                    <div class="source-card-header"><span>1. TRÙNG LẶP - 90%</span></div>
                    <div class="source-card-title">A345_Quyet_dinh_3875_UBND.pdf</div>
                </div>
                <div class="source-card">
                    <div class="source-card-header"><span>2. TRÙNG LẶP - 79%</span></div>
                    <div class="source-card-title">A5_Luan_van_Trac_nghiem_truc_tuyen.docx</div>
                </div>
                
            </div>
            <div id="matchedSentencePanel"
     style="
        border-top:1px solid #e2e8f0;
        padding:12px;
        background:white;
        height:400px;
        overflow-y:auto;
     ">
    Chọn một nguồn để xem chi tiết
</div>
        </div>

    </div>

    <!-- Thư viện pdf.js để tự render PDF, nhờ vậy mới bôi màu được bằng JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc =
                "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        }
    </script>
    <!-- Module render PDF kèm lớp bôi màu câu trùng -->
    <script src="../js/pdf-highlight-viewer.js"></script>

    <!-- Bảng câu trùng / đoạn trùng / đoạn chắp vá ở cột bên phải.
         Nạp trước chitiet.js vì chitiet.js gọi hàm của nó. -->
    <script src="../js/chitiet-bang-trung.js"></script>

    <!-- Gọi file JS xử lý dữ liệu từ localStorage -->
    <script src="../js/chitiet.js"></script>
    <!-- Thư viện đọc file Word (.docx) trực tiếp trên web -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <!-- Thư viện docx-preview để hiển thị file Word giữ nguyên 100% định dạng, căn lề -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.20/dist/docx-preview.min.js"></script>

    <!-- Tính năng mới: Xuất Excel, Modal lỗi, Đánh giá -->
    <script src="../js/tinh-nang-moi.js"></script>

    <script>
        // Lấy reportId từ URL và lưu vào biến toàn cục để nút Đánh giá dùng
        (function () {
            const p = new URLSearchParams(window.location.search);
            window.__reportId__ = p.get('id') || '';
        })();

        // Hàm gọi khi bấm nút Xuất Excel (dùng reportId toàn cục)
        function xuatExcelChiTiet() {
            if (!window.__reportId__) {
                if (typeof thongBao === 'function') thongBao('Chưa xác định được mã báo cáo!');
                return;
            }
            window.xuatExcelKetQua(window.__reportId__);
        }
    </script>
</head>
</head>
</body>
</html>
